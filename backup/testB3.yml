name: demo-summary-failure

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Step échoue
        run: exit 1

      - name: Résumé forcé
        if: always()
        run: |
          {
            echo "## ❌ Échec du workflow"
            echo ""
            echo "Le workflow s'est arrêté suite à une erreur."
            echo ""
            echo "Consulte les logs du step précédent."
          } >> $GITHUB_STEP_SUMMARY