name: Apply Project Roadmap

on:
  workflow_dispatch:
    inputs:
      t0:
        description: |
          Project start date (YYYY-MM-DD):
          -- workflow run date by default --
        type: string
        default: ""
      force_apply:
        description: Apply despite warnings.
        type: boolean
        default: false

env:
  REPO: ${{ github.repository }}

jobs:
  gate:
    name: Pre-flight Audit (Pristine Repo Check)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.audit.outputs.go }}
    permissions:
      contents: read
      issues: read
    steps:
      - name: Verify Issue Tracker is Empty
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --- PHASE 1: INSPECTION ---
          # Defining query parameters (Fast-scan for any Open or Closed issues)
          options=(
            --repo "$REPO"
            --state all
            --limit 1
            --json number -q length
          )
          
          # Execute query
          issue_count=$(gh issue list "${options[@]}")
          milestone_count=$(gh api \
            "/repos/$REPO/milestones?state=all&per_page=1" \
            --jq 'length'
          )
          # repos/$REPO/milestones?state=all&per_page=1 --jq 'length')

          echo "NOMBRE DE MILESTONES: $milestone_count"

          # # --- PHASE 2: DECISION & REPORTING
