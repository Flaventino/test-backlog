name: Apply Project Roadmap
on:
  workflow_dispatch:
    inputs:
      force_apply:
        description: 'Ignore JSON file validation failures.'
        type: boolean
        default: false

jobs:
  validate-and-deploy-plan:
    name: Validate & Apply Roadmap To GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      PLAN: '_roadmap/roadmap_plan.json'
      FORCE: ${{ inputs.force_apply }}
      PLAN_MARKER: '_roadmap/.plan_applied'
      PLAN_CHECKER: '_roadmap/validate_plan.py'
      PLAN_APPLIER: '_roadmap/apply_plan.py'
      # github.event.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Marker File Existence
        id: marker
        run: |
          if [ -f "$PLAN_MARKER" ]; then
            echo "Plan marker found, skipping workflow."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            # TEST TEST TEST TEST TEST TEST TEST TEST TEST TEST TEST TEST TEST
            reason="Plan marker file '$PLAN_MARKER' exists."
            echo "::notice title=Workflow skipped::$reason"

            {
              echo "## Workflow skipped (no-op)"
              echo
              echo "**Reason:** $reason"
              echo
              echo "All remaining jobs were skipped to save CI time."
              echo
              echo "### How to proceed"
              echo "- Remove the marker, or update the plan."
              echo "- Re-run the workflow afterwards."
            } >> "$GITHUB_STEP_SUMMARY"
            # FIN TEST FIN TEST FIN TEST FIN TEST FIN TEST FIN TEST FIN TEST
          fi

      - name: Setup UV
        if: steps.marker.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v3

      - name: Validate Project Plan
        id: validate
        if: steps.marker.outputs.exists == 'false'
        run: |
          set -uo pipefail

          # Suspend exit-on-error to trap upstream validation status
          set +e
          uv run \
              --no-project \
              --python 3.14 \
              --with "pydantic>=2.12,<2.13" \
              "$PLAN_CHECKER" --plan "$PLAN" | \
              tee report.txt

          # Capture upstream status & restore strict mode
          status=${PIPESTATUS[0]}
          set -e
          
          # Eval bypass condition (code 20 + force flag)
          [[ $status -eq 20 && "$FORCE" == "true" ]] && bypass=0 || bypass=1

          # Assert step success criteria
          [[ $status -eq 0 || $bypass -eq 0 ]] || exit $status

