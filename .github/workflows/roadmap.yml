name: Apply Project Roadmap
on:
  workflow_dispatch:
    inputs:
      force_apply:
        description: 'Ignore JSON file validation failures.'
        type: boolean
        default: false

jobs:
  validate-and-deploy-plan:
    name: Validate & Apply Roadmap To GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      PLAN: '_roadmap/roadmap_plan.json'
      REPO: ${{ github.repository }}
      FORCE: ${{ inputs.force_apply }}
      # PLAN_MARKER: '_roadmap/.plan_applied'
      PLAN_CHECKER: '_roadmap/validate_plan.py'
      PLAN_APPLIER: '_roadmap/apply_plan.py'
    steps:
      - name: Gate - Verify Zero Issues
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fast-scan for any issue presence (Open or Closed)
          issue_count=$(gh issue list \
            --repo "$REPO" \
            --state all \
            --limit 1 \
            --json number -q length)

          # Workflow execution decision
          if [ "$issue_count" -eq 0 ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT

            # 1. Signal User (Notice)
            echo "::notice title=Workflow skipped::GitHub Issues is not empty."

            # 2. Generate Report (Summary)
            {
              echo "## Workflow Skipped"
              echo "**Reason:** Repository already contains GitHub Issues (Open or Closed)."
              echo "> *Execution bypassed to prevent data overwrite.*"
              echo
              echo "### Context"
              echo "This workflow is a **Bootstrap** tool designed to run ONLY on a pristine repository."
              echo "It detects activity in the Issue Tracker and halts to ensure safety."
            } >> "$GITHUB_STEP_SUMMARY"
          fi


