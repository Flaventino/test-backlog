name: Deploy Project roadmap
on:
  workflow_dispatch:

jobs:
  validate-and-deploy-plan:
    name: Validate & Deploy Roadmap To GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAN: '_roadmap/roadmap_plan.json'
      LOCK_FILE: '_roadmap/.roadmap_activated'
      PLAN_CHECKER: '_roadmap/validate_plan.py'
      PLAN_DEPLOYER: '_roadmap/deploy_plan.py'
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v3

      - name: Run The Plan Validation Script
        run: uv run "$PLAN_CHECKER" --file "$PLAN" --marker "$LOCK_FILE"

      - name: Run Deployment Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/seed.py
