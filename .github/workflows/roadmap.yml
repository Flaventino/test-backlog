name: Deploy Project roadmap
on:
  workflow_dispatch:

jobs:
  validate-and-deploy-plan:
    name: Validate & Deploy Roadmap to GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Deployment Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/seed.py
