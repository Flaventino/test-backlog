name: Deploy Project roadmap
env:
  PLAN: '_roadmap/roadmap_plan.json'
  LOCK_FILE: '_roadmap/.roadmap_activated'
  PLAN_CHECKER: '_roadmap/validate_plan.py'
  PLAN_DEPLOYER: '_roadmap/deploy_plan.py'
on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment despite JSON file validation failure'
        type: boolean
        default: false

jobs:
  validate-and-deploy-plan:
    name: Validate & Deploy Roadmap To GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # env:
    #   PLAN: '_roadmap/roadmap_plan.json'
    #   LOCK_FILE: '_roadmap/.roadmap_activated'
    #   PLAN_CHECKER: '_roadmap/validate_plan.py'
    #   PLAN_DEPLOYER: '_roadmap/deploy_plan.py'
      # FORCE_DEPLOYMENT: ${{ github.event.inputs.force_deploy == 'true' }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Marker File Existence
        id: marker
        run: |
          if [ -f "$LOCK_FILE" ]; then
            # echo "Deployment already performed — skipping"
            echo "already_deployed=true" >> $GITHUB_OUTPUT
          else
            echo "already_deployed=false" >> $GITHUB_OUTPUT
          fi

