name: Apply Project Roadmap

on:
  workflow_dispatch:
    inputs:
      t0:
        description: "Optional project start date T0 (ISO): YYYY-MM-DD. If empty: defaults to workflow run date."
        type: string
        default: ""
      force_apply:
        description: 'Apply even if warnings are present (errors still abort).'
        type: boolean
        default: false

env:
  REPO: ${{ github.repository }}

jobs:
  gate:
    name: Pre-flight Audit (Pristine Repo Check)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.audit.outputs.go }}
    permissions:
      contents: read
      issues: read
    steps:
      - name: Setup GitHub CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.1.0
        with:
          gh-cli-version: latest

      - name: Verify Issue Tracker is Empty
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --- PHASE 1: INSPECTION ---
          # Defining query parameters (Fast-scan for any Open or Closed issues)
          options=(
            --repo "$REPO"
            --state all
            --limit 1
            --json number -q length
          )

          # Execute query
          issue_count=$(gh issue list "${options[@]}")
          echo "I S S U E   L I S T : $issue_count"
          milestone_count=$(gh milestone list "${options[@]}")
          echo "M I L E S T O N E S   L I S T : $milestone_count"
          # --- PHASE 2: DECISION & REPORTING
          if [ "$issue_count" -eq 0 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"

            # A. Signal User (Notice)
            echo "::notice title=Workflow skipped::GitHub Issues is not empty."

            # B. Generate Report (Summary)
            {
              echo "## Workflow Skipped"
              echo "**Reason:** Repository already contains GitHub Issues (Open or Closed)."
              echo "> *Execution bypassed to prevent data overwrite.*"
              echo
              echo "### Context"
              echo "This workflow is a **Bootstrap** tool designed to run ONLY on a pristine repository."
              echo "It detects activity in the Issue Tracker and halts to ensure safety."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  process-roadmap:
    name: Roadmap Processing
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.go == 'true'
    permissions:
      contents: read
      issues: write
    env:
      PLAN: '_roadmap/roadmap_plan.json'
      FORCE: ${{ inputs.force_apply }}
      PLAN_CHECKER: '_roadmap/validate_plan.py'
      PLAN_APPLIER: '_roadmap/apply_plan.py'
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Tooling (uv)
        uses: astral-sh/setup-uv@v3

      - name: Validate Project Plan
        run: |
          set -uo pipefail

          # --- EXECUTE VALIDATION PROCESS ---
          # A. Configure UV environment & args
          uv_args=(
            --no-project
            --python 3.14
            --with "pydantic>=2.12,<2.13"
          )

          # B. Execute with upstream error trapping
          set +e
          uv run "${uv_args[@]}" "$PLAN_CHECKER" --plan "$PLAN" | tee report.txt
          status=${PIPESTATUS[0]}
          set -e

          # --- DECISION LOGIC ---
          # CASE 1: SUCCESS
          if [ "$status" -eq 0 ]; then exit 0; fi

          # CASE 2: CRITICAL ERRORS
          if [ "$status" -ne 20 ]; then exit $status; fi

          # CASE 3: VALIDATION FAILURES (code 20)
          # A. Build Public Report
          {
            echo "## 🛑 Validation Failed"
            echo "The document \`$PLAN\` did not pass validation rules."
            echo
            echo "### 📋 Compliance Report"
            echo '```text'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # B. Apply Force Policy
          if [ "$FORCE" == "true" ]; then
            # FORCE ON -> WARNING & CONTINUE
            echo "::warning title=Safety Override::Validation failed but execution was FORCED by user."
            echo "> ⚠️ **WARNING:** Execution continues because 'FORCE' mode is active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            # FORCE OFF -> ERROR & STOP
            echo "::error title=Validation Blocked::Document is invalid. See Summary for details."
            echo "> ⛔ **STOP:** Workflow halted standard safety procedure." >> "$GITHUB_STEP_SUMMARY"
            exit 20
          fi

      # - name: Apply Plan (create GitHub Issues)
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     # --- PHASE 1: EXECUTION ---
      #     # A. Configure UV environment & args
      #     uv_args=(
      #       --no-project
      #       --python 3.14
      #       --with "pydantic>=2.12,<2.13"
      #     )

      #     # B. Execute Roadmap Application
      #     uv run "${uv_args[@]}" "$PLAN_APPLIER" --plan "$PLAN"