name: "Crash Test Backlog"
on: workflow_dispatch
jobs:
  seed:
    runs-on: ubuntu-latest
    permissions: { issues: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Run Seeder
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: python3 .github/seed.py
